services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hansard
      POSTGRES_USER: hansard
      POSTGRES_PASSWORD: hansard_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hansard']
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hansard:hansard_dev@postgres:5432/hansard

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${API_PORT:-3001}:3001'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hansard:hansard_dev@postgres:5432/hansard

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Same-origin: nginx in the web container reverse-proxies /api/* to
        # API_UPSTREAM below, so the SPA fetches its own origin.
        VITE_API_URL: ${VITE_API_URL:-/api}
    environment:
      # Resolved by Docker's internal DNS on the compose network.
      API_UPSTREAM: ${API_UPSTREAM:-http://api:3001}
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      - api

volumes:
  pgdata:
